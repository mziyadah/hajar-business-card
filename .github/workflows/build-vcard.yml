name: Build iPhone contact card
on:
  workflow_dispatch:
  push:
    paths:
      - Image.jpg
      - scripts/build_vcard.py
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - run: python scripts/build_vcard.py
      - name: Commit generated vCard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hajar-belhaoud.vcf hajar-belhaoud-v4.vcf
          git diff --cached --quiet || (git commit -m "Embed portrait in iPhone contact card" && git push)
